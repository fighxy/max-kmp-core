[versions]
kotlin = "2.1.10"
agp = "8.7.3"
okhttp = "4.12.0"
coroutines = "1.10.1"
serialization = "1.8.0"
compose-mp = "1.7.3"
android-compileSdk = "35"
android-minSdk = "26"

[libraries]
# Media CDN client on JVM / Android (core/src/jvmAndroidShared/.../media/OkHttpMediaHttp.kt); iOS uses
# NSURLSession from platform.Foundation (no dependency). Ktor was dropped: the transport needs a raw TLS
# stream (java.net.Socket / Network.framework) and media only needs plain HTTP requests with exact
# headers and upload progress, which OkHttp / NSURLSession give directly without a common-code dependency.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# MessagePack: no library; pure-Kotlin codec in core/src/commonMain/kotlin/com/max/core/protocol/MessagePack.kt

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
