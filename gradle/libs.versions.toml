[versions]
kotlin = "2.1.10"
agp = "8.7.3"
ktor = "3.1.1"
coroutines = "1.10.1"
serialization = "1.8.0"
compose-mp = "1.7.3"
android-compileSdk = "35"
android-minSdk = "26"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# ktor-client-* kept for a future HTTP layer (media / ws2); the transport does not use them.
# ktor-network + ktor-network-tls: Network works on jvm/android/iosArm64/iosSimulatorArm64 in 3.1.1,
# but ktor-network-tls on Native is a stub ("TLS sessions are not supported on Native platform"),
# so the transport uses java.net.Socket + javax.net.ssl on JVM/Android instead and leaves iOS TODO.
# The ktor-network-tls alias is removed so it is not added as a dead dependency.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# MessagePack: no library; pure-Kotlin codec in core/src/commonMain/kotlin/com/max/core/protocol/MessagePack.kt

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
