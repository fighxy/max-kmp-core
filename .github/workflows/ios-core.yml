# Compiles and tests :core and :shared for iOS Simulator arm64 (and JVM, Android compile of
# :core, :shared and :android, plus the :ios MaxIos simulator framework) on macOS. The Linux agent
# that authors the Network.framework code cannot run Kotlin/Native for iOS; this workflow is the
# compile check. None of the targets are run on a device.
name: iOS core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'android/**'
      - 'ios/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'android/**'
      - 'ios/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-core.yml'

# macos-14 ≈ 10× Linux minute cost; keep the path filter and a single job.
concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-and-jvm:
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.7 (libs.versions.toml) needs the Android SDK even though this job only builds the
      # shared KMP `:core` module. GitHub macOS runners ship a preinstalled SDK (ANDROID_HOME),
      # so no setup action is needed.

      # Wrapper pins Gradle 8.10.2 (compatible with AGP 8.7.3 and Kotlin 2.1.10).
      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests
        run: ./gradlew :core:jvmTest :shared:jvmTest --no-daemon --stacktrace

      - name: Compile Kotlin/Native iOS Simulator
        run: ./gradlew :core:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

      - name: iOS Simulator tests
        # Offline tests run; @Ignore integration tests need the Max servers (see NetworkFrameworkConnectionFactoryTest).
        run: ./gradlew :core:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Compile Android (core + shared)
        # androidMain of :core and :shared (SharedPreferencesStore, OkHttp media). Compiled here, not run on a device.
        run: ./gradlew :core:compileDebugKotlinAndroid :shared:compileDebugKotlinAndroid --no-daemon --stacktrace

      - name: Compile Android library module
        # :android is a plain Android library (kotlin.android), Java 17. Compiled here, not run on a device.
        run: ./gradlew :android:compileDebugKotlin --no-daemon --stacktrace

      - name: Link iOS facade framework
        # MaxIosClient in :ios. Simulator debug link only; the app builds the release XCFramework.
        run: ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
